name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install Dalamud libraries
        shell: pwsh
        run: ./scripts/Get-DalamudLib.ps1 -Destination "$env:RUNNER_TEMP/dalamud-lib"

      - name: Build
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ runner.temp }}/dalamud-lib
        run: |
          # The plugin embeds translation artifacts at build time. CI does not
          # generate them: a plugin built without them still compiles, and the
          # tests use the checked-in fixture instead.
          dotnet build Sinophone.sln -c Release

      - name: Test
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ runner.temp }}/dalamud-lib
        run: >
          dotnet test Sinophone.sln -c Release --no-build
          --logger "console;verbosity=normal"
          --logger trx --results-directory TestResults
          --collect:"Code Coverage"

      - name: Check the test count did not drop
        shell: pwsh
        # A green run proves the tests that ran passed. It does not prove any ran. This
        # counts the results and fails when fewer tests ran than the floor, so a pull
        # request that deletes or silently skips tests cannot pass on a smaller suite.
        env:
          MINIMUM_VALIDATION_TESTS: 740
        run: |
          $results = Get-ChildItem TestResults -Recurse -Filter *.trx
          if (-not $results) {
            throw "No test results were produced."
          }

          $total = 0
          foreach ($file in $results) {
            [xml]$xml = Get-Content -LiteralPath $file.FullName
            $counters = $xml.TestRun.ResultSummary.Counters
            $total += [int]$counters.total
          }

          Write-Host "Tests run: $total (floor: $env:MINIMUM_VALIDATION_TESTS)"
          if ($total -lt [int]$env:MINIMUM_VALIDATION_TESTS) {
            throw "Only $total tests ran, below the floor of $env:MINIMUM_VALIDATION_TESTS. " +
              "A test was deleted or skipped. Raise the floor when tests are added."
          }

      - name: Build with the testing code
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ runner.temp }}/dalamud-lib
        run: |
          # The developer half of the testing tab is compiled out of a normal build and is
          # never run by CI. This step compiles it, so a broken game API fails here rather
          # than only on a dev machine. Run after the tests, so the tested DLL stays the one
          # a release ships.
          dotnet build src/Sinophone/Sinophone.csproj -c Release -p:IncludeTesting=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 14
