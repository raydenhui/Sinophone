name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install Dalamud libraries
        shell: pwsh
        run: ./scripts/Get-DalamudLib.ps1 -Destination "$env:RUNNER_TEMP/dalamud-lib"

      - name: Build
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ runner.temp }}/dalamud-lib
        run: |
          # The plugin embeds translation artifacts at build time. CI does not
          # generate them: a plugin built without them still compiles, and the
          # tests use the checked-in fixture instead.
          dotnet build Sinophone.sln -c Release

      - name: Test
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ runner.temp }}/dalamud-lib
        run: >
          dotnet test Sinophone.sln -c Release --no-build
          --logger "console;verbosity=normal"
          --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 14
