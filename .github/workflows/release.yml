name: Release

# Builds the plugin on a version tag, attaches latest.zip to a GitHub release,
# and updates the Dalamud repository manifest so clients see the new version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Dalamud libraries
        shell: pwsh
        run: ./scripts/Get-DalamudLib.ps1 -Destination "$env:RUNNER_TEMP/dalamud-lib"

      - name: Build
        shell: pwsh
        env:
          DALAMUD_HOME: ${{ runner.temp }}/dalamud-lib
        run: |
          # Release builds run DalamudPackager. It writes the zip under the
          # build output path, which includes the runtime identifier.
          dotnet build src/Sinophone/Sinophone.csproj -c Release

      - name: Check the package
        id: package
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path src/Sinophone/bin/Release -Recurse -Filter latest.zip |
                 Select-Object -First 1
          if (-not $zip) {
              throw "The packager did not produce latest.zip."
          }

          Get-Item $zip.FullName | Select-Object FullName, Length
          "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "${{ steps.package.outputs.zip }}#latest.zip" `
            --title "Sinophone $tag" `
            --generate-notes `
            --latest

      - name: Update the repository manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")

          # Dalamud compares a four-part assembly version.
          $parts = @($version.Split("."))
          while ($parts.Count -lt 4) { $parts += "0" }
          $assemblyVersion = $parts[0..3] -join "."

          git fetch origin main
          git checkout main

          # Dalamud requires an array, even for a single plugin. PowerShell
          # unwraps a one-item array when it parses JSON, so normalize it back
          # and write with -AsArray.
          $manifest = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          if ($manifest -isnot [System.Array]) {
              $manifest = @($manifest)
          }

          $manifest[0].AssemblyVersion = $assemblyVersion
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $manifest | ConvertTo-Json -Depth 5 -AsArray | Set-Content pluginmaster.json -Encoding utf8

          $written = Get-Content pluginmaster.json -Raw
          if (-not $written.TrimStart().StartsWith('[')) {
              throw "pluginmaster.json must be a JSON array for Dalamud."
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git commit -m "chore: update plugin manifest for $version"
          git push origin main
