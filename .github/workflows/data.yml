name: Data

# Builds the translation artifacts from the datamining CSV dumps and publishes
# them to the "data" release. The plugin downloads that release at runtime, so
# users get updated translations without waiting for a plugin build.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish translation data
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: List sheets
        shell: bash
        run: |
          set -euo pipefail

          # The sheet list lives in the DataPrep tool. Ask it instead of keeping
          # a second copy here that could drift.
          mapfile -t sheets < <(
            dotnet run --project tools/Sinophone.DataPrep -c Release -- --list-sheets \
              | sed -n 's/^sheet://p'
          )

          if (( ${#sheets[@]} == 0 )); then
            echo "::error::DataPrep reported no sheets."
            exit 1
          fi

          printf '%s\n' "${sheets[@]}" > sheets.txt
          echo "Sheets: ${sheets[*]}"

      - name: Download datamining CSVs
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t sheets < sheets.txt

          mkdir -p csv/cn csv/tc

          for sheet in "${sheets[@]}"; do
            curl -fsSL --retry 3 -o "csv/cn/$sheet.csv" \
              "https://raw.githubusercontent.com/thewakingsands/ffxiv-datamining-cn/master/$sheet.csv" \
              || echo "::warning::CN $sheet.csv is not available"
            curl -fsSL --retry 3 -o "csv/tc/$sheet.csv" \
              "https://raw.githubusercontent.com/thewakingsands/ffxiv-datamining-tc/master/$sheet.csv" \
              || echo "::warning::TC $sheet.csv is not available"
          done

      - name: Build artifacts
        shell: bash
        run: |
          set -euo pipefail

          cn_commit=$(git ls-remote https://github.com/thewakingsands/ffxiv-datamining-cn HEAD | cut -c1-12)
          tc_commit=$(git ls-remote https://github.com/thewakingsands/ffxiv-datamining-tc HEAD | cut -c1-12)

          dotnet run --project tools/Sinophone.DataPrep -c Release -- \
            --source csv/cn --language CN \
            --output out/Sinophone.cn.json.gz --game-version "CN $cn_commit"

          dotnet run --project tools/Sinophone.DataPrep -c Release -- \
            --source csv/tc --language TC \
            --output out/Sinophone.tc.json.gz --game-version "TC $tc_commit"

          echo "CN_COMMIT=$cn_commit" >> "$GITHUB_ENV"
          echo "TC_COMMIT=$tc_commit" >> "$GITHUB_ENV"

      - name: Write manifest
        shell: bash
        run: |
          set -euo pipefail

          cn_sha=$(sha256sum out/Sinophone.cn.json.gz | cut -d' ' -f1)
          tc_sha=$(sha256sum out/Sinophone.tc.json.gz | cut -d' ' -f1)

          python3 - "$cn_sha" "$tc_sha" <<'PY'
          import datetime
          import gzip
          import hashlib
          import json
          import os
          import sys

          cn_sha, tc_sha = sys.argv[1:3]

          def sheets_digest(path):
              with gzip.open(path, "rt", encoding="utf-8") as file:
                  artifact = json.load(file)

              # The version must change only when the translation data changes.
              # GeneratedAt and GameVersion change on every build, so leave them out.
              canonical = json.dumps(
                  artifact["Sheets"], sort_keys=True, separators=(",", ":"), ensure_ascii=False
              )
              return hashlib.sha256(canonical.encode("utf-8")).hexdigest()

          cn_digest = sheets_digest("out/Sinophone.cn.json.gz")
          tc_digest = sheets_digest("out/Sinophone.tc.json.gz")
          version = hashlib.sha256((cn_digest + tc_digest).encode("utf-8")).hexdigest()[:16]

          manifest = {
              "formatVersion": 1,
              "version": version,
              "generatedAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "cnSha256": cn_sha,
              "tcSha256": tc_sha,
              "cnSourceCommit": os.environ["CN_COMMIT"],
              "tcSourceCommit": os.environ["TC_COMMIT"],
          }

          with open("out/manifest.json", "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2)
              file.write("\n")

          print(f"version {version}")
          PY

      - name: Compare with the published data
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          published=""
          mkdir -p published
          if gh release download data --pattern manifest.json --dir published --clobber 2>/dev/null; then
            published=$(python3 -c "import json; print(json.load(open('published/manifest.json')).get('version', ''))")
          fi

          built=$(python3 -c "import json; print(json.load(open('out/manifest.json'))['version'])")
          echo "Published version: ${published:-none}"
          echo "Built version:     $built"

          if [[ -n "$published" && "$published" == "$built" ]]; then
            echo "The translation data has not changed. Skipping the upload."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish data release
        if: steps.compare.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          assets=(
            out/manifest.json
            out/Sinophone.cn.json.gz
            out/Sinophone.tc.json.gz
          )

          if gh release view data >/dev/null 2>&1; then
            gh release upload data "${assets[@]}" --clobber
          else
            gh release create data \
              --title "Translation data" \
              --notes "Generated translation data for the Sinophone plugin. Downloaded by the plugin at runtime." \
              --latest=false \
              "${assets[@]}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: translation-data
          path: |
            out/manifest.json
            out/Sinophone.cn.json.gz
            out/Sinophone.tc.json.gz
          retention-days: 14
